name: Deprovision Participant

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Remove workshop attendees and delete template copies
        env:
          GH_TOKEN: ${{ secrets.VSLIVE_REPOCREATE }}
          ORG: XpiritCommunityEvents
          TEMPLATE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Loading participant repositories in $ORG..."
          repos=$(gh api "/orgs/$ORG/repos?per_page=100" --paginate \
            --jq '.[] | .name | select(test("^attendee-workshopAF-[A-Za-z0-9-]+$"))')

          if [ -z "$repos" ]; then
            echo "No participant repositories found. Nothing to clean up."
            exit 0
          fi

          cleanup_failed=0

          while IFS= read -r repo; do
            handle="${repo#attendee-workshopAF-}"
            echo "Processing $ORG/$repo (participant: $handle)..."

            if ! template_repository=$(gh api "repos/$ORG/$repo" --jq '.template_repository.full_name // ""' 2>&1); then
              echo "ERROR: Could not verify the template source for $ORG/$repo:" >&2
              echo "$template_repository" >&2
              cleanup_failed=1
              continue
            fi

            if [[ "${template_repository,,}" != "${TEMPLATE_REPOSITORY,,}" ]]; then
              echo "Leaving $ORG/$repo and '$handle' untouched; it is not a copy of $TEMPLATE_REPOSITORY."
              continue
            fi

            echo "Removing '$handle' from $ORG or canceling their invitation..."
            if remove_response=$(gh api --include --silent --method DELETE \
              "/orgs/$ORG/memberships/$handle" 2>&1); then
              if ! grep -qE '^HTTP/[^ ]+ 204([[:space:]]|$)' <<< "$remove_response"; then
                echo "ERROR: Unexpected response removing $handle:" >&2
                echo "$remove_response" >&2
                cleanup_failed=1
                continue
              fi
              echo "Removed '$handle' from $ORG or canceled their invitation."
            elif grep -qE '^HTTP/[^ ]+ 404([[:space:]]|$)' <<< "$remove_response"; then
              echo "'$handle' is already not a member of $ORG."
            else
              echo "ERROR: Could not remove '$handle' from $ORG:" >&2
              echo "$remove_response" >&2
              cleanup_failed=1
              continue
            fi

            echo "Deleting $ORG/$repo..."
            if gh repo delete "$ORG/$repo" --yes; then
              echo "Deleted $ORG/$repo."
            else
              echo "ERROR: Could not delete $ORG/$repo." >&2
              cleanup_failed=1
            fi
          done <<< "$repos"

          if (( cleanup_failed )); then
            echo "Cleanup finished with errors." >&2
            exit 1
          fi

          echo "Cleanup complete."
