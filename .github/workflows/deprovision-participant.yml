name: Deprovision Participant

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Remove workshop attendees and delete template copies
        env:
          GH_TOKEN: ${{ secrets.VSLIVE_REPOCREATE }}
          ORG: XpiritCommunityEvents
          TEMPLATE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          schema_valid=$(gh api "/orgs/$ORG/properties/schema/holagentframework_attendee_user_id" \
            --jq '.value_type == "string" and .values_editable_by == "org_actors"')
          if [[ "$schema_valid" != "true" ]]; then
            echo "ERROR: The attendee user ID property must be a string editable only by organization actors." >&2
            exit 1
          fi

          echo "Loading participant repositories in $ORG..."
          repos=$(gh api "/orgs/$ORG/repos?per_page=100" --paginate \
            --jq '.[] | .name | select(test("^attendee-workshopAF-[A-Za-z0-9-]+$"))')

          if [ -z "$repos" ]; then
            echo "No participant repositories found. Nothing to clean up."
            exit 0
          fi

          cleanup_failed=0

          while IFS= read -r repo; do
            echo "Processing $ORG/$repo..."

            if ! template_repository=$(gh api "repos/$ORG/$repo" --jq '.template_repository.full_name // ""' 2>&1); then
              echo "ERROR: Could not verify the template source for $ORG/$repo:" >&2
              echo "$template_repository" >&2
              cleanup_failed=1
              continue
            fi

            if [[ "${template_repository,,}" != "${TEMPLATE_REPOSITORY,,}" ]]; then
              echo "Leaving $ORG/$repo untouched; it is not a copy of $TEMPLATE_REPOSITORY."
              continue
            fi

            if ! user_id=$(gh api "repos/$ORG/$repo/properties/values" \
              --jq '.[] | select(.property_name == "holagentframework_attendee_user_id") | .value // ""' 2>&1); then
              echo "ERROR: Could not read the attendee user ID for $ORG/$repo:" >&2
              echo "$user_id" >&2
              cleanup_failed=1
              continue
            fi
            if [[ ! "$user_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "ERROR: $ORG/$repo has no valid attendee user ID property; skipping cleanup. Populate the property after verifying the attendee." >&2
              cleanup_failed=1
              continue
            fi
            if ! handle=$(gh api "user/$user_id" --jq '.login' 2>&1); then
              echo "ERROR: Could not resolve the attendee user ID for $ORG/$repo:" >&2
              echo "$handle" >&2
              cleanup_failed=1
              continue
            fi
            if [[ ! "$handle" =~ ^[A-Za-z0-9-]{1,39}$ ]]; then
              echo "ERROR: GitHub returned an invalid attendee handle for $ORG/$repo." >&2
              cleanup_failed=1
              continue
            fi

            echo "Removing '$handle' from $ORG or canceling their invitation..."
            if remove_response=$(gh api --include --silent --method DELETE \
              "/orgs/$ORG/memberships/$handle" 2>&1); then
              if ! grep -qE '^HTTP/[^ ]+ 204([[:space:]]|$)' <<< "$remove_response"; then
                echo "ERROR: Unexpected response removing $handle:" >&2
                echo "$remove_response" >&2
                cleanup_failed=1
                continue
              fi
              echo "Removed '$handle' from $ORG or canceled their invitation."
            elif grep -qE '^HTTP/[^ ]+ 404([[:space:]]|$)' <<< "$remove_response"; then
              echo "'$handle' is already not a member of $ORG."
            else
              echo "ERROR: Could not remove '$handle' from $ORG:" >&2
              echo "$remove_response" >&2
              cleanup_failed=1
              continue
            fi

            echo "Deleting $ORG/$repo..."
            if gh repo delete "$ORG/$repo" --yes; then
              echo "Deleted $ORG/$repo."
            else
              echo "ERROR: Could not delete $ORG/$repo." >&2
              cleanup_failed=1
            fi
          done <<< "$repos"

          if (( cleanup_failed )); then
            echo "Cleanup finished with errors." >&2
            exit 1
          fi

          echo "Cleanup complete."
