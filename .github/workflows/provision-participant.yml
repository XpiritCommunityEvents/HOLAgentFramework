name: Provision Participant environment

on:
  issues:
    types:
      - closed

  workflow_dispatch:
    inputs: 
      githubhandle: 
        required: true
        type: text 
  
jobs:
  build:
    runs-on: ubuntu-latest  

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Get issue creator
      id: github_handle
      uses: actions/github-script@v8
      env:
        GITHUB_HANDLE: ${{ github.event.inputs.githubhandle }}
      with:
        result-encoding: string
        script: |
          let handle;
          if (context.eventName === "issues") {
            const subject = context.payload.issue;
            if (subject.labels.some(label => label.name === "signup")) {
              handle = subject.user.login;
            } else {
              throw new Error("Issue did not have a signup label");
            }
          } else {
            handle = process.env.GITHUB_HANDLE;
          }
          if (!/^[A-Za-z0-9-]{1,39}$/.test(handle ?? "")) {
            throw new Error("A valid GitHub handle is required");
          }
          return handle;
        
    - name: Verify attendee property schema
      env:
        GH_TOKEN: ${{ secrets.VSLIVE_REPOCREATE }}
      run: |
        schema_valid=$(gh api /orgs/XpiritCommunityEvents/properties/schema/holagentframework_attendee_user_id \
          --jq '.value_type == "string" and .values_editable_by == "org_actors"')
        if [[ "$schema_valid" != "true" ]]; then
          echo "ERROR: The attendee user ID property must be a string editable only by organization actors." >&2
          exit 1
        fi

    - name: Invite Member to Organization
      id: participant
      env:
        GH_TOKEN: ${{ secrets.VSLIVE_REPOCREATE }}
        GITHUB_HANDLE: ${{ steps.github_handle.outputs.result }}
        ORG: XpiritCommunityEvents
      run: |
        if ! user_id=$(gh api "users/$GITHUB_HANDLE" --jq '.id' 2>&1); then
          echo "ERROR: Could not find GitHub user '$GITHUB_HANDLE':" >&2
          echo "$user_id" >&2
          exit 1
        fi

        if [[ ! "$user_id" =~ ^[1-9][0-9]*$ ]]; then
          echo "ERROR: GitHub returned an invalid user ID." >&2
          exit 1
        fi

        if ! invitation=$(gh api --method POST "/orgs/$ORG/invitations" \
          -F "invitee_id=$user_id" \
          -F role=direct_member 2>&1); then
          echo "ERROR: Could not invite '$GITHUB_HANDLE' to $ORG. Check the token's organization-owner access and Members: write permission:" >&2
          echo "$invitation" >&2
          exit 1
        fi
        echo "Invited '$GITHUB_HANDLE' to $ORG."
        echo "user_id=$user_id" >> "$GITHUB_OUTPUT"

    - name: Create Repository
      env:
        GH_TOKEN: ${{ secrets.VSLIVE_REPOCREATE }}
        GITHUB_HANDLE: ${{ steps.github_handle.outputs.result }}
        ORG: XpiritCommunityEvents
        TEMPLATE_REPOSITORY: ${{ github.repository }}
        ATTENDEE_USER_ID: ${{ steps.participant.outputs.user_id }}
      run: |
        repo_name="$ORG/attendee-workshopAF-$GITHUB_HANDLE"
        if gh repo view "$repo_name" &>/dev/null; then
          echo "Repository $repo_name already exists."
        else
          echo "Repository $repo_name does not exist."
          gh repo create "$repo_name" \
            --public \
            --template "$TEMPLATE_REPOSITORY"
        fi

        template_repository=$(gh api "repos/$repo_name" --jq '.template_repository.full_name // ""')
        if [[ "${template_repository,,}" != "${TEMPLATE_REPOSITORY,,}" ]]; then
          echo "ERROR: $repo_name is not a copy of $TEMPLATE_REPOSITORY; refusing to assign an attendee." >&2
          exit 1
        fi

        stored_id=$(gh api "repos/$repo_name/properties/values" \
          --jq '.[] | select(.property_name == "holagentframework_attendee_user_id") | .value // ""')
        if [[ -n "$stored_id" && "$stored_id" != "$ATTENDEE_USER_ID" ]]; then
          echo "ERROR: $repo_name already belongs to a different attendee; refusing to overwrite their user ID." >&2
          exit 1
        fi
        printf '{"properties":[{"property_name":"holagentframework_attendee_user_id","value":"%s"}]}' "$ATTENDEE_USER_ID" |
          gh api --method PATCH "repos/$repo_name/properties/values" --input -
        stored_id=$(gh api "repos/$repo_name/properties/values" \
          --jq '.[] | select(.property_name == "holagentframework_attendee_user_id") | .value // ""')
        if [[ "$stored_id" != "$ATTENDEE_USER_ID" ]]; then
          echo "ERROR: Attendee user ID was not saved on $repo_name." >&2
          exit 1
        fi

    - name: Install GH Collab
      run: |
        gh extension install mislav/gh-repo-collab
      env:
        GH_TOKEN: ${{ secrets.VSLIVE_REPOCREATE }}

    - name: Set Rights to Repo
      env:
        GH_TOKEN: ${{ secrets.VSLIVE_REPOCREATE }}
        GITHUB_HANDLE: ${{ steps.github_handle.outputs.result }}
        ORG: XpiritCommunityEvents
      run: |
        gh repo-collab add "$ORG/attendee-workshopAF-$GITHUB_HANDLE" "$GITHUB_HANDLE" --permission admin
    
